pluginManagement {
    repositories { maven { url = 'https://maven.fabricmc.net' }; gradlePluginPortal(); mavenCentral() }
}
def targets = providers.gradleProperty('targets').orElse('1.21.10').get().split(',')
targets.each { mc ->
    include(":${mc}")
    project(":${mc}").projectDir = file("versions/${mc}")
}
include ':core'
