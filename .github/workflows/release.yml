name: release
on:
  push:
    tags: ['v*\+1.21.1']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release metadata
        id: release-metadata
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' versions/1.21.1/gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          [[ "$GITHUB_REF_NAME" == "v${version}+1.21.1" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/1.21.1
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test version project
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21.1:remapJar :core:test --stacktrace
      - name: Verify and stage artifacts
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: python3 .github/scripts/stage-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: litematica-printer-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Append Minecraft 1.21.1 assets to main release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: python3 .github/scripts/publish-release.py
