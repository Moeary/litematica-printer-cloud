name: build
on:
  push:
    branches: ['1.21.1']
    paths-ignore: ['*.md']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Minecraft 1.21.1
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21.1:remapJar :core:test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: litematica-printer-mc1.21.1-${{ github.sha }}
          path: versions/1.21.1/build/libs/litematica-printer-*.jar
          if-no-files-found: error
