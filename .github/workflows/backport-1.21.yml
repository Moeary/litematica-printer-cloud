name: Mapped 1.21 backports
on:
  push:
    branches: ["dory/printer-1.1.3-1.21.x"]
  pull_request:
    branches: ["dory/printer-1.1.3-1.21.x"]
permissions:
  contents: read
concurrency:
  group: mapped-production-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: llvmpipe
  MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
  SDL_VIDEODRIVER: x11
  SDL_VIDEO_DRIVER: x11
  SDL_VIDEO_FORCE_EGL: '1'
jobs:
  cancel-superseded:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Stop older runs of this workflow on this same branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          url = base + '/actions/workflows/backport-1.21.yml/runs?per_page=100&branch=' + urllib.parse.quote(os.environ['GITHUB_REF_NAME'], safe='')
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              runs = json.load(response)['workflow_runs']
          for run in runs:
              if run['id'] >= int(os.environ['GITHUB_RUN_ID']) or run['status'] == 'completed':
                  continue
              try:
                  request = urllib.request.Request(base + '/actions/runs/' + str(run['id']) + '/cancel', data=b'', headers=headers, method='POST')
                  urllib.request.urlopen(request).close()
                  print('Cancelled superseded run', run['id'])
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
          PY
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        minecraft: ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mapped release and test core
        run: |
          chmod +x gradlew
          ./gradlew -Ptargets=${{ matrix.minecraft }} :core:test :${{ matrix.minecraft }}:remapJar --no-daemon --stacktrace
      - name: Retain distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: litematica-printer-${{ matrix.minecraft }}-${{ github.sha }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-dev.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-smoke-test.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-audit-*.jar
      - name: Install production client graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libflite1
      - name: Verify public release inventory and run all production client assertions
        run: python .github/scripts/run-mapped-ci.py '${{ matrix.minecraft }}' functional
      - name: Retain actual client assertions and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-client-${{ matrix.minecraft }}-${{ github.sha }}
          path: .ci/results/${{ matrix.minecraft }}/
          if-no-files-found: error
      - name: Retain unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.minecraft }}-${{ github.sha }}
          path: core/build/test-results/
  audit:
    name: Dedicated loss and real bedrock miners (${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        minecraft: ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install production client graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-vulkan-drivers libflite1
      - name: Build the tested native NetworkChaos fixture and audit components
        env:
          MC: ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          api=$(python -c "import json,os; print(json.load(open('.github/mapped-ci-inputs.json'))[os.environ['MC']]['fabricApiVersion'])")
          ./gradlew -p .github/fixtures/network-chaos remapJar "-Pminecraft_version=$MC" "-Pfabric_api_version=$api" --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1500M -Dfile.encoding=UTF-8'
          mkdir -p "../NetworkChaosFabric/$MC/build/libs"
          cp ".ci/network/build/libs/network-chaos-audit-$MC.jar" "../NetworkChaosFabric/$MC/build/libs/network-chaos-fabric-1.0.0-alpha.3-audit+$MC.jar"
          ./gradlew "-Ptargets=$MC" -I .github/scripts/mapped-ci.gradle ":$MC:remapJar" ":$MC:remapAuditJar" ":$MC:remapAuditServerJar" -PciKind=stress --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx1500M -Dfile.encoding=UTF-8'
      - name: Run real miners and strict dedicated Servux packet-loss assertions
        run: python .github/scripts/run-mapped-ci.py '${{ matrix.minecraft }}' audit
      - name: Retain every pass and failure result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-audit-${{ matrix.minecraft }}-${{ github.sha }}
          path: .ci/results/${{ matrix.minecraft }}/
          if-no-files-found: error
