name: Append verified MC 1.21.4 asset
on:
  push:
    branches: ["dory/printer-1.1.3-1.21.x"]
    paths: [".github/workflows/append-verified-1.21.4.yml", ".github/verified-assets/1.21.4.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: append-verified-mapped-release
  cancel-in-progress: false
jobs:
  append:
    if: github.ref == 'refs/heads/dory/printer-1.1.3-1.21.x'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a8a70bbec989fbcda7e7a1631af502131f4ed597
          path: .ci/pinned
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the pinned passing source
        working-directory: .ci/pinned
        run: |
          chmod +x gradlew
          ./gradlew -Ptargets=1.21.4 :core:test :1.21.4:remapJar --no-daemon --stacktrace
      - name: Check every class and resource, then append the canonical asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ASSET_CONFIG: .github/verified-assets/1.21.4.json
        run: python .github/scripts/append_verified_release_asset.py
